<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#3b68f0" />
<title>Offline · OneWebDev</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root { color-scheme: light dark; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; --brand: #3b68f0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --card: #131c31; --text: #f1f5f9; --muted: #94a3b8; --line: #1e293b; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 20px; margin: 16px 0 4px; }
  p { margin: 0 0 4px; color: var(--muted); }
  .en { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
  .en h2 { font-size: 16px; margin: 0 0 4px; }
  button { margin-top: 22px; border: 0; border-radius: 10px; padding: 10px 18px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid #94b3fb; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="favicon.svg" alt="" />
  <h1>Anda sedang offline</h1>
  <p>Halaman ini butuh koneksi internet. Periksa jaringan Anda, lalu coba lagi. Alat yang sudah pernah dibuka tetap bisa dipakai tanpa internet.</p>
  <div class="en" lang="en">
    <h2>You're offline</h2>
    <p>This page needs an internet connection. Check your network and try again. Tools you've opened before still work offline.</p>
  </div>
  <button type="button" onclick="location.reload()">Coba lagi · Try again</button>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>

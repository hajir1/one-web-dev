<style id="owd-theme">
/* Colors & style: edit here or in the OneWebDev editor. */
:root {
  --bg-1: #0b1020; /* Latar bawah */
  --bg-2: #1d2a52; /* Latar atas */
  --c-1: #ff5d5d; /* Roket & angka */
  --c-2: #7fd1ff; /* Jendela */
  --c-3: #ffc857; /* Api & landasan */
  --ink: #f2f5ff; /* Warna teks */
  --speed: 1; /* Kecepatan animasi [0.25,3,0.05] */
}
</style>
<style>
:root { --k: calc(1s / var(--speed)); --font-display: "Space Grotesk", Georgia, serif; --font-text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg-1); color: var(--ink); font-family: var(--font-text); overflow: hidden; }
.stage { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(180deg, var(--bg-2), var(--bg-1)); }
.scene, .scene * { position: absolute; }
.scene { inset: 0; }
.scene i, .scene b, .scene span { display: block; }

.cap { position: absolute; left: clamp(16px, 6vw, 96px); top: 50%; transform: translateY(-50%); z-index: 5; display: flex; flex-direction: column; gap: 12px; width: min(520px, calc(100vw - 32px)); animation: capIn calc(var(--k) * 1.2) cubic-bezier(.2,.8,.2,1) both; }
.cap .kicker { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--c-1); }
.cap h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(32px, 5.4vw, 64px); line-height: 1.05; text-wrap: balance; text-shadow: 0 2px 24px color-mix(in srgb, var(--bg-1) 70%, transparent); }
.cap p.text { margin: 0; font-size: clamp(15px, 1.6vw, 18px); line-height: 1.6; color: color-mix(in srgb, var(--ink) 84%, transparent); text-shadow: 0 1px 12px color-mix(in srgb, var(--bg-1) 80%, transparent); }
.cap .cta { align-self: flex-start; margin-top: 6px; display: inline-flex; align-items: center; min-height: 46px; padding: 0 22px; border-radius: 999px; background: var(--c-1); color: var(--bg-1); font-weight: 600; text-decoration: none; box-shadow: 0 12px 30px -12px color-mix(in srgb, var(--c-1) 80%, #000); }
.cap .cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
@keyframes capIn { from { opacity: 0; translate: 0 20px; } }

.controls { position: absolute; right: 16px; bottom: 16px; z-index: 6; display: flex; gap: 8px; }
.controls button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); background: color-mix(in srgb, var(--bg-1) 55%, transparent); color: var(--ink); font: 500 14px var(--font-text); cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.controls button:focus-visible { outline: 2px solid var(--c-1); outline-offset: 2px; }
.stage.paused *, .stage.paused *::before, .stage.paused *::after { animation-play-state: paused !important; }
@media (max-width: 640px) {
  .cap { left: 16px; right: auto; top: clamp(56px, 9vh, 96px); transform: none; }
  .controls { right: 12px; bottom: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; }
  .cap { animation: none; }
}

/* ---- scene ---- */

.streaks i { top: -20%; width: 2px; height: var(--h); background: linear-gradient(transparent, #fff); opacity: 0; animation: streak calc(var(--k) * .9) linear infinite, streakOn calc(var(--k) * 10) linear infinite; animation-delay: calc(var(--k) * var(--d)), 0s; }
@keyframes streak { to { transform: translateY(130vh); } }
@keyframes streakOn { 0%, 45% { opacity: 0; } 55%, 92% { opacity: .7; } 100% { opacity: 0; } }
.count { left: 50%; top: 22%; width: 0; height: 0; }
.count span { left: -40px; top: -60px; width: 80px; text-align: center; font: 700 96px/1 var(--font-display); color: var(--c-1); opacity: 0; animation: tick calc(var(--k) * 10) linear infinite; }
.count span:nth-child(2) { animation-name: tick2; } .count span:nth-child(3) { animation-name: tick3; }
@keyframes tick { 0% { opacity: 0; scale: 1.6; } 3%, 10% { opacity: 1; scale: 1; } 13%, 100% { opacity: 0; } }
@keyframes tick2 { 0%, 12% { opacity: 0; scale: 1.6; } 15%, 22% { opacity: 1; scale: 1; } 25%, 100% { opacity: 0; } }
@keyframes tick3 { 0%, 24% { opacity: 0; scale: 1.6; } 27%, 34% { opacity: 1; scale: 1; } 37%, 100% { opacity: 0; } }
.pad { left: 50%; bottom: 0; width: 44vmin; height: 7vh; margin-left: -22vmin; background: linear-gradient(var(--c-3), color-mix(in srgb, var(--c-3) 60%, #000)); border-radius: 8px 8px 0 0; }
.smoke { left: 50%; bottom: 5vh; width: 0; height: 0; }
.smoke i { left: -8vmin; top: -8vmin; width: 16vmin; height: 16vmin; border-radius: 50%; background: color-mix(in srgb, #fff 80%, var(--c-3)); opacity: 0; animation: puff calc(var(--k) * 10) ease-out infinite; animation-delay: calc(var(--k) * var(--d)); }
@keyframes puff { 0%, 30% { opacity: 0; translate: 0 0; scale: .2; } 40% { opacity: .95; } 60% { opacity: .6; translate: var(--x) -2vh; scale: 1.6; } 80%, 100% { opacity: 0; translate: calc(var(--x) * 1.6) -4vh; scale: 2.2; } }
.rocket { left: 50%; bottom: 7vh; width: 14vmin; height: 40vmin; margin-left: -7vmin; animation: launch calc(var(--k) * 10) cubic-bezier(.6,0,.9,.5) infinite; }
@keyframes launch { 0%, 36% { translate: 0 0; } 38% { translate: -2px 0; } 40% { translate: 2px 0; } 42% { translate: 0 -1vh; } 85% { translate: 0 -130vh; } 86%, 100% { translate: 0 60vh; } }
.body { inset: 0 0 12% 0; border-radius: 50% 50% 18% 18% / 34% 34% 10% 10%; background: linear-gradient(90deg, #d8dce3, #fff 40%, #c9ced8); }
.window { left: 30%; top: 26%; width: 40%; height: 13%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, var(--c-2) 60%); border: 4px solid var(--c-1); }
.fin { bottom: 8%; width: 40%; height: 26%; background: var(--c-1); }
.fin.l { left: -26%; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
.fin.r { right: -26%; clip-path: polygon(0 0, 100% 100%, 0 100%); }
.fire { left: 22%; bottom: -16%; width: 56%; height: 30%; border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%; background: radial-gradient(circle at 50% 20%, #fff, var(--c-3) 40%, var(--c-1) 75%, transparent); opacity: 0; transform-origin: 50% 0; animation: fire calc(var(--k) * .15) ease-in-out infinite alternate, fireOn calc(var(--k) * 10) linear infinite; }
@keyframes fire { to { scale: .8 1.3; } }
@keyframes fireOn { 0%, 34% { opacity: 0; } 38%, 100% { opacity: 1; } }
</style>
</head>
<body>
<div class="stage">
<div class="scene" aria-hidden="true">
<div class="streaks"><i style="left:83.6%;--d:-0.32;--h:48px"></i><i style="left:80.1%;--d:-1.27;--h:90px"></i><i style="left:52.6%;--d:-0.75;--h:101px"></i><i style="left:75.9%;--d:-0.55;--h:41px"></i><i style="left:97.4%;--d:-1.67;--h:124px"></i><i style="left:0.9%;--d:-0.83;--h:102px"></i><i style="left:51.6%;--d:-1.03;--h:90px"></i><i style="left:32.5%;--d:-1.87;--h:48px"></i><i style="left:35.0%;--d:-2.00;--h:81px"></i><i style="left:99.2%;--d:-0.87;--h:100px"></i><i style="left:26.9%;--d:-0.38;--h:84px"></i><i style="left:32.8%;--d:-0.71;--h:40px"></i><i style="left:82.8%;--d:-0.77;--h:97px"></i><i style="left:37.8%;--d:-0.08;--h:102px"></i><i style="left:29.1%;--d:-1.41;--h:128px"></i><i style="left:93.9%;--d:-0.99;--h:87px"></i><i style="left:75.1%;--d:-0.92;--h:114px"></i><i style="left:25.6%;--d:-1.31;--h:119px"></i><i style="left:34.2%;--d:-0.11;--h:125px"></i><i style="left:21.6%;--d:-0.41;--h:59px"></i><i style="left:85.3%;--d:-0.65;--h:43px"></i><i style="left:23.8%;--d:-1.93;--h:139px"></i><i style="left:20.0%;--d:-1.66;--h:102px"></i><i style="left:24.4%;--d:-1.27;--h:114px"></i><i style="left:87.6%;--d:-0.28;--h:128px"></i><i style="left:61.6%;--d:-1.02;--h:55px"></i></div>
<div class="count"><span>3</span><span>2</span><span>1</span></div>

  <p class="text" data-owd-text="pesan" data-owd-label="Pesan" data-owd-multi>Halaman hitung mundur untuk peluncuran produk, aplikasi, atau toko baru. Satu tombol, satu tujuan.</p>
  <a class="cta" href="#" data-owd-href="tautan" data-owd-href-label="Tautan tombol" data-owd-text="tombol" data-owd-label="Teks tombol">Daftar lebih dulu</a>

<div class="controls">
  <button type="button" id="pause" aria-pressed="false">Jeda</button>
  <button type="button" id="again">Ulangi</button>
</div>
</div>
<script>
/* ==== SETTINGS: autoplay, and the second shown as a still frame ==== */
const CONFIG = /*owd:data name="CONFIG" label="Pengaturan animasi"*/{
  "mainOtomatis": true,
  "detikDiam": 4.6
}/*owd:end*/;
const stage = document.querySelector(".stage");
const btnPause = document.getElementById("pause");
const btnAgain = document.getElementById("again");
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const anims = () => (document.getAnimations ? document.getAnimations() : []);
/* Freeze every CSS animation on one chosen frame (thumbnails, reduce motion). */
function still() { const ms = (+CONFIG.detikDiam || 0) * 1000; for (const a of anims()) { try { a.currentTime = ms; a.pause(); } catch (e) {} } }
function setPaused(p) { stage.classList.toggle("paused", p); btnPause.textContent = p ? "Lanjutkan" : "Jeda"; btnPause.setAttribute("aria-pressed", String(p)); }
btnPause.addEventListener("click", () => setPaused(!stage.classList.contains("paused")));
btnAgain.addEventListener("click", () => { if (reduce.matches) return still(); for (const a of anims()) { try { a.currentTime = 0; a.play(); } catch (e) {} } setPaused(false); });
/* Hidden tab: pause; visible again: resume unless the visitor paused it. */
let pausedByUser = false;
document.addEventListener("visibilitychange", () => { if (document.hidden) { pausedByUser = stage.classList.contains("paused"); stage.classList.add("paused"); } else if (!pausedByUser && !reduce.matches && !window.OWD_THUMB) stage.classList.remove("paused"); });
reduce.addEventListener("change", () => (reduce.matches ? still() : btnAgain.click()));
if (window.OWD_THUMB || reduce.matches) still();
else if (CONFIG.mainOtomatis === false) setPaused(true);
</script>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-owd-text="judulTab" data-owd-label="Judul tab browser">Surat Merpati</title>
<meta name="description" content="Animasi cerita: amplop tertutup terbuka, suratnya keluar lalu terlipat menjadi burung kertas yang terbang menggambar hati di langit senja.">
<script>
/* Vercel Web Analytics: aktifkan menu "Analytics" di dashboard proyek Vercel. */
window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
(function () { if (!/^https?:$/.test(location.protocol) || window.top !== window.self || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return; var s = document.createElement("script"); s.defer = true; s.src = "/_vercel/insights/script.js"; document.head.appendChild(s); })();
</script>
<meta name="theme-color" content="#2b1d3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<style id="owd-theme">
/* Warna & gaya: ubah di sini atau lewat editor OneWebDev. */
:root {
  --bg-1: #2b1d3a; /* Latar bawah */
  --bg-2: #6b3f6e; /* Latar tengah */
  --bg-3: #f2a07b; /* Latar atas */
  --c-1: #f1d9b5; /* Amplop */
  --c-2: #c2304a; /* Segel lilin */
  --c-3: #ffe3a3; /* Jejak terbang */
  --ink: #fff7ee; /* Warna teks */
  --panel: #2b1d3a; /* Latar kartu ucapan */
  --speed: 1; /* Kecepatan animasi [0.25,3,0.05] */
}
</style>
<style>
:root {
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg-1); color: var(--ink); font-family: var(--font-text); overflow: hidden; -webkit-tap-highlight-color: transparent; }
.stage { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 55%, var(--bg-1) 100%); cursor: pointer; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.caps { position: absolute; left: 0; right: 0; top: clamp(56px, 11vh, 120px); z-index: 2; display: grid; place-items: center; padding: 0 20px; pointer-events: none; }
.cap { grid-area: 1 / 1; margin: 0; max-width: 22ch; text-align: center; font-family: var(--font-display); font-weight: 500; font-style: italic; font-size: clamp(26px, 4.4vw, 52px); line-height: 1.15; color: var(--ink); text-shadow: 0 2px 22px color-mix(in srgb, var(--panel) 80%, transparent); opacity: 0; }
.cap.on { opacity: 1; }
.cap.out { transition-duration: calc(.35s / var(--speed)) !important; }
.cap { opacity: 1; }
.cap .w { display: inline-block; white-space: pre; opacity: 0; transform: translateY(.5em) rotate(6deg); transition: opacity calc(.6s / var(--speed)) ease, transform calc(.6s / var(--speed)) cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--i) * 28ms / var(--speed)); }
.cap.on .w { opacity: 1; transform: none; }

.note { position: absolute; left: 50%; bottom: clamp(76px, 10vh, 110px); transform: translateX(-50%); text-align: center; z-index: 3; width: min(560px, calc(100vw - 32px)); padding: clamp(24px, 4vw, 40px); border-radius: 28px; background: color-mix(in srgb, var(--panel) 78%, transparent); border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); box-shadow: 0 30px 80px -30px rgba(0,0,0,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; visibility: hidden; transition: opacity calc(1.1s / var(--speed)) ease, visibility 0s linear calc(1.1s / var(--speed)), translate calc(1.1s / var(--speed)) cubic-bezier(.2,.8,.2,1); translate: 0 24px; cursor: auto; }
.note.on { opacity: 1; visibility: visible; translate: 0 0; transition-delay: 0s; }
.note .to { margin: 0 0 10px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--c-1); font-weight: 600; }
.note h1 { margin: 0; font-family: var(--font-display); font-weight: 500; font-style: italic; font-size: clamp(32px, 5vw, 56px); line-height: 1.08; color: var(--ink); }
.note p { margin: 16px 0 0; font-size: clamp(16px, 1.6vw, 18px); line-height: 1.65; color: color-mix(in srgb, var(--ink) 82%, transparent); }
.note .from { margin-top: 20px; font-family: var(--font-display); font-style: italic; font-size: 22px; color: var(--ink); }

.hint { position: absolute; left: 50%; bottom: clamp(20px, 4vh, 36px); z-index: 2; translate: -50% 0; margin: 0; padding: 8px 16px; border-radius: 999px; font-size: 13px; letter-spacing: .04em; color: var(--ink); background: color-mix(in srgb, var(--panel) 60%, transparent); opacity: .9; pointer-events: none; transition: opacity .6s; animation: nudge calc(2.4s / var(--speed)) ease-in-out infinite; }
.hint.off { opacity: 0; }
@keyframes nudge { 50% { translate: -50% -5px; } }
.dots { position: absolute; left: 16px; bottom: 26px; z-index: 3; display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); opacity: .25; transition: opacity .4s, width .4s; }
.dots i.on { opacity: .9; width: 20px; border-radius: 4px; }
.controls { position: absolute; right: 16px; bottom: 16px; z-index: 4; display: flex; gap: 8px; }
.controls button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); background: color-mix(in srgb, var(--panel) 62%, transparent); color: var(--ink); font: 500 14px var(--font-text); cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.controls button:hover { background: color-mix(in srgb, var(--panel) 88%, transparent); }
.controls button:focus-visible { outline: 2px solid var(--c-1); outline-offset: 2px; }
@media (max-width: 640px) {
  .controls { bottom: 12px; right: 12px; }
  .controls button { padding: 0 12px; font-size: 13px; }
  .dots { bottom: 30px; }
  .hint { bottom: 70px; }
  .note {  }
}
@media (prefers-reduced-motion: reduce) {
  .cap, .note, .hint { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="stage">
<canvas id="cv" aria-hidden="true"></canvas>
<div class="caps" aria-live="polite">
<p class="cap" data-fx="letters" data-owd-text="babak1" data-owd-label="Teks babak 1">Ada surat yang menunggumu.</p>
<p class="cap" data-fx="letters" data-owd-text="babak2" data-owd-label="Teks babak 2">Isinya terlalu ringan untuk tinggal di amplop.</p>
<p class="cap" data-fx="letters" data-owd-text="babak3" data-owd-label="Teks babak 3">Jadi ia terbang menemuimu.</p>
</div>
<main class="note">
  <p class="to" data-owd-text="untuk" data-owd-label="Untuk (sapaan)">Untuk Rania,</p>
  <h1 data-owd-text="judul" data-owd-label="Judul">Jarak cuma angka.</h1>
  <p data-owd-text="pesan" data-owd-label="Pesan" data-owd-multi>Seribu kilometer tidak pernah cukup jauh untuk membuatku berhenti memikirkanmu. Sampai bertemu bulan depan.</p>
  <p class="from" data-owd-text="dari" data-owd-label="Dari (tanda tangan)">Dimas</p>
</main>
<p class="hint" data-owd-text="petunjuk" data-owd-label="Petunjuk ketuk">Ketuk untuk membuka</p>
<div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="controls">
  <button type="button" id="pause" aria-pressed="false">Jeda</button>
  <button type="button" id="again">Ulangi</button>
</div>
</div>
<script>
/* ==== PENGATURAN: lama tiap babak (detik), maju otomatis, dan data adegan ==== */
const CONFIG = /*owd:data name="CONFIG" label="Pengaturan animasi"*/{
  "detikPerBabak": 4.5,
  "majuOtomatis": true
}/*owd:end*/;
function scene(api) {
  const { g, COL, seg, lerp, ease, rgba, glowDot } = api;
  /* Bentuk surat (8 titik) dan burung kertas (8 titik) untuk dilebur. */
  const PAPER = [[-1, -0.7], [0, -0.7], [1, -0.7], [1, 0], [1, 0.7], [0, 0.7], [-1, 0.7], [-1, 0]];
  const BIRD = [[-1.5, -0.55], [-0.2, -0.05], [0.25, -0.1], [0.9, -0.45], [0.55, 0.05], [0.15, 0.32], [-0.4, 0.2], [-0.2, 0.0]];
  const trail = [];
  const heartAt = (u) => { const a = u * Math.PI * 2; return [16 * Math.pow(Math.sin(a), 3) / 17, -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 17]; };
  function poly(pts) { g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); }
  return {
    reset() { trail.length = 0; },
    draw(t, B) {
      const W = api.W, H = api.H, u = Math.min(W, H) / 100;
      const cx = W / 2, cy = H * 0.58;
      const open = seg(B, 0.05, 0.7), out = seg(B, 0.35, 1), fold = seg(B, 1.05, 1.75), fly = seg(B, 1.8, 2.95);
      const ew = u * 26, eh = u * 17;
      /* Amplop: badan, isi surat, tutup yang berputar terbuka. */
      const envFade = 1 - seg(B, 1.6, 2.2);
      if (envFade > 0) {
        g.globalAlpha = envFade;
        g.save(); g.translate(cx, cy + Math.sin(t * 1.4) * u * 0.4 * (1 - open));
        g.fillStyle = COL["c-1"]; g.fillRect(-ew, -eh, ew * 2, eh * 2);
        g.fillStyle = rgba("#000000", 0.08); g.beginPath(); g.moveTo(-ew, eh); g.lineTo(0, 0); g.lineTo(ew, eh); g.closePath(); g.fill();
        g.restore();
        g.globalAlpha = 1;
      }
      /* Surat: keluar dari amplop, lalu dilipat menjadi burung. */
      const lx = lerp(cx, cx, fold), ly = cy - out * eh * 1.6 - fold * u * 6;
      const sc = lerp(ew * 0.85, u * 9, fold);
      let px = lx, py = ly;
      if (fly > 0) {
        const hp = heartAt(fly * 0.999 + 0.0001);
        px = lerp(lx, W / 2 + hp[0] * u * 20, seg(fly, 0, 0.12)); py = lerp(ly, H * 0.32 + hp[1] * u * 18, seg(fly, 0, 0.12));
        trail.push([px, py]); if (trail.length > 900) trail.shift();
      }
      if (fly > 0.02 && trail.length > 2) {
        g.lineWidth = u * 0.5; g.lineCap = "round"; g.strokeStyle = rgba(COL["c-3"], 0.85);
        g.beginPath(); trail.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.stroke();
        for (let i = 0; i < trail.length; i += 18) glowDot(trail[i][0], trail[i][1], u * 2.4, COL["c-3"], 0.18);
      }
      const flap = fold > 0.95 ? Math.sin(t * 9) * 0.35 : 0;
      const pts = PAPER.map((p, i) => { const b = BIRD[i]; let x = lerp(p[0], b[0], ease(fold)), y = lerp(p[1], b[1], ease(fold)); if (i === 3) y += flap; if (i === 0) y -= flap * 0.4; return [px + x * sc, py + y * sc]; });
      if (out > 0.01 || fold > 0) {
        g.save();
        if (out < 1 && fold === 0) { g.beginPath(); g.rect(cx - ew, -H, ew * 2, H + cy + eh * 0.2); g.clip(); }
        g.fillStyle = "#fffdf7"; poly(pts); g.fill();
        g.strokeStyle = rgba("#000000", 0.12); g.lineWidth = 1; g.stroke();
        if (fold < 0.4) { g.globalAlpha = 1 - fold * 2.5; g.fillStyle = rgba(COL["c-2"], 0.5); for (let i = 0; i < 5; i++) g.fillRect(lx - sc * 0.7, ly - sc * 0.45 + i * sc * 0.2, sc * (i === 4 ? 0.7 : 1.4), sc * 0.05); g.globalAlpha = 1; }
        g.restore();
      }
      if (envFade > 0) {
        g.globalAlpha = envFade;
        g.save(); g.translate(cx, cy - eh);
        const fl = Math.cos(open * Math.PI);
        g.fillStyle = fl > 0 ? api.mix(COL["c-1"], "#000000", 0.12) : api.mix(COL["c-1"], "#ffffff", 0.18);
        g.beginPath(); g.moveTo(-ew, 0); g.lineTo(0, eh * 1.05 * fl); g.lineTo(ew, 0); g.closePath(); g.fill();
        if (open < 0.5) { g.fillStyle = COL["c-2"]; g.beginPath(); g.arc(0, eh * 0.95 * fl, u * 3.2, 0, 7); g.fill(); g.fillStyle = rgba("#ffffff", 0.35); api.heart(0, eh * 0.95 * fl - u * 1.4, u * 2.6); }
        g.restore();
        g.globalAlpha = 1;
      }
      if (fly >= 0.99) { const pulse = 0.5 + Math.sin(t * 2) * 0.2; glowDot(W / 2, H * 0.32, u * 30, COL["c-3"], 0.12 * pulse); }
    },
  };
}
const stage = document.querySelector(".stage");
const cv = document.getElementById("cv");
const g = cv.getContext("2d");
const caps = [...document.querySelectorAll(".cap")];
const note = document.querySelector(".note");
const hint = document.querySelector(".hint");
const dots = [...document.querySelectorAll(".dots i")];
const btnPause = document.getElementById("pause");
const btnAgain = document.getElementById("again");
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const N = caps.length + 1; /* babak terakhir = kartu ucapan */
const css = getComputedStyle(document.documentElement);
const COL = {};
function readColors() { for (const k of ["bg-1", "bg-2", "bg-3", "c-1", "c-2", "c-3", "ink", "panel"]) COL[k] = css.getPropertyValue("--" + k).trim() || "#888"; COL.speed = parseFloat(css.getPropertyValue("--speed")) || 1; }
readColors();

/* Huruf berjatuhan untuk efek "letters". */
for (const c of caps) if (c.dataset.fx === "letters") { const words = c.textContent.split(/(\s+)/); c.textContent = ""; let i = 0; for (const w of words) { const s = document.createElement("span"); s.className = "w"; s.style.setProperty("--i", i++); s.textContent = w; c.appendChild(s); } }

/* Bantuan untuk adegan. */
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const seg = (v, a, b) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rgba(hex, a) {
  const m = /rgba?\(([^)]+)\)/.exec(hex); if (m) { const v = m[1].split(","); return "rgba(" + v[0] + "," + v[1] + "," + v[2] + "," + a + ")"; }
  let h = String(hex).replace("#", ""); if (h.length === 3) h = h.split("").map((x) => x + x).join("");
  const n = parseInt(h.slice(0, 6), 16); if (isNaN(n)) return "rgba(255,255,255," + a + ")";
  return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
}
function mix(h1, h2, t) {
  const p = (h) => { const m = /rgba?\(([^)]+)\)/.exec(h); if (m) return m[1].split(",").map(Number); let s = String(h).replace("#", ""); if (s.length === 3) s = s.split("").map((x) => x + x).join(""); const n = parseInt(s.slice(0, 6), 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const a = p(h1), b = p(h2); return "rgb(" + Math.round(lerp(a[0], b[0], t)) + "," + Math.round(lerp(a[1], b[1], t)) + "," + Math.round(lerp(a[2], b[2], t)) + ")";
}
function glowDot(x, y, r, color, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(color, a)); gr.addColorStop(1, rgba(color, 0)); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
function heart(x, y, s) { g.beginPath(); g.moveTo(x, y + s * 0.35); g.bezierCurveTo(x, y, x - s * 0.5, y - s * 0.1, x - s * 0.5, y + s * 0.25); g.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s); g.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.25); g.bezierCurveTo(x + s * 0.5, y - s * 0.1, x, y, x, y + s * 0.35); g.fill(); }
/* Titik-titik pembentuk teks (untuk partikel yang menyusun kata). */
function textPoints(text, w, h, step, font) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  let fs = h * 0.8; x.font = (font || "700 ") + fs + "px " + (css.getPropertyValue("--font-display") || "serif");
  while (x.measureText(text).width > w * 0.94 && fs > 10) { fs -= 4; x.font = (font || "700 ") + fs + "px " + (css.getPropertyValue("--font-display") || "serif"); }
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(text, w / 2, h / 2);
  const d = x.getImageData(0, 0, w, h).data, pts = [];
  for (let yy = 0; yy < h; yy += step) for (let xx = 0; xx < w; xx += step) if (d[(yy * w + xx) * 4 + 3] > 120) pts.push([xx / w - 0.5, yy / h - 0.5]);
  return pts;
}

let W = 0, H = 0, DPR = 1;
const api = { g, COL, CONFIG, rnd, clamp, lerp, ease, seg, rgba, mix, glowDot, heart, textPoints, get W() { return W; }, get H() { return H; }, get small() { return W < 640; } };
const S = scene(api);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (S.resize) S.resize(W, H);
}

/* Waktu cerita: B naik pelan menuju target; target naik satu babak tiap detikPerBabak. */
let B = 0, target = 0, t = 0, last = 0, raf = 0, paused = false, held = 0, frameN = 0, shown = -1;
const beatSec = () => Math.max(1.5, +CONFIG.detikPerBabak || 4.5) / COL.speed;
function setBeat(i) {
  if (i === shown) return; shown = i;
  caps.forEach((c, k) => { c.classList.toggle("on", k === i); c.classList.toggle("out", k < i); c.setAttribute("aria-hidden", k === i ? "false" : "true"); });
  note.classList.toggle("on", i >= N - 1);
  dots.forEach((d, k) => d.classList.toggle("on", k === i));
  if (i > 0) hint.classList.add("off");
}
function next() { if (target < N - 1) { target = Math.min(N - 1, Math.floor(target + 1e-6) + 1); held = 0; } }
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000 || 0.016)); last = now;
  if (!paused) {
    t += dt * COL.speed;
    held += dt;
    if (CONFIG.majuOtomatis !== false && held > beatSec() && target < N - 1) next();
    B += (target - B) * Math.min(1, dt * 1.6 * COL.speed);
    if (Math.abs(target - B) < 0.002) B = target;
  }
  if (++frameN % 30 === 0) readColors();
  setBeat(Math.min(N - 1, Math.round(B - 0.2 < 0 ? 0 : B - 0.2)));
  g.clearRect(0, 0, W, H);
  S.draw(t, B, dt);
  raf = requestAnimationFrame(frame);
}
function start() { cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(frame); }
function still() { cancelAnimationFrame(raf); B = target = N - 1; t = 20; setBeat(N - 1); g.clearRect(0, 0, W, H); S.draw(t, B, 0); }

stage.addEventListener("click", (e) => { if (e.target.closest(".note, .controls")) return; next(); });
addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "ArrowRight" || e.key === "Enter") && !e.target.closest("button, a")) { e.preventDefault(); next(); } });
btnPause.addEventListener("click", () => { paused = !paused; btnPause.textContent = paused ? "Lanjutkan" : "Jeda"; btnPause.setAttribute("aria-pressed", String(paused)); stage.classList.toggle("paused", paused); });
btnAgain.addEventListener("click", () => { B = target = 0; held = 0; t = 0; shown = -1; hint.classList.remove("off"); if (S.reset) S.reset(); if (reduce.matches) { still(); return; } paused = false; btnPause.textContent = "Jeda"; start(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) cancelAnimationFrame(raf); else if (!reduce.matches && !window.OWD_THUMB) start(); });
reduce.addEventListener("change", () => (reduce.matches ? still() : start()));
addEventListener("resize", () => { resize(); if (reduce.matches || window.OWD_THUMB) still(); });

resize();
if (window.OWD_THUMB || reduce.matches) still();
else { setBeat(0); start(); }
</script>
</body>
</html>

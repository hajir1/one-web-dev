<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-owd-text="judulTab" data-owd-label="Judul tab browser">Kereta Malam</title>
<meta name="description" content="Animasi rindu: jembatan kosong di bawah bulan, kereta malam datang lalu berhenti, tiap jendela menyalakan satu huruf, kemudian kereta pergi meninggalkan bintang.">
<script>

</script>
<meta name="theme-color" content="#0a0f22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
<style id="owd-theme">
/* Colors & style: edit here or in the OneWebDev editor. */
:root {
  --bg-1: #0a0f22; /* Latar bawah */
  --bg-2: #18224a; /* Latar tengah */
  --bg-3: #2c3b72; /* Latar atas */
  --c-1: #e4572e; /* Lokomotif */
  --c-2: #2d4a7c; /* Gerbong */
  --c-3: #ffd27a; /* Lampu jendela */
  --ink: #f4f1ea; /* Warna teks */
  --panel: #0f1630; /* Latar kartu ucapan */
  --speed: 1; /* Kecepatan animasi [0.25,3,0.05] */
}
</style>
<style>
:root {
  --font-display: "Space Grotesk", Georgia, serif;
  --font-text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg-1); color: var(--ink); font-family: var(--font-text); overflow: hidden; -webkit-tap-highlight-color: transparent; }
.stage { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 55%, var(--bg-1) 100%); cursor: pointer; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.caps { position: absolute; left: 0; right: 0; top: clamp(56px, 11vh, 120px); z-index: 2; display: grid; place-items: center; padding: 0 20px; pointer-events: none; }
.cap { grid-area: 1 / 1; margin: 0; max-width: 22ch; text-align: center; font-family: var(--font-display); font-weight: 500; font-size: clamp(26px, 4.4vw, 52px); line-height: 1.15; color: var(--ink); text-shadow: 0 2px 22px color-mix(in srgb, var(--panel) 80%, transparent); opacity: 0; }
.cap.on { opacity: 1; }
.cap.out { transition-duration: calc(.35s / var(--speed)) !important; }
.cap { transform: translateX(-40px); transition: opacity calc(1s / var(--speed)) ease, transform calc(1s / var(--speed)) cubic-bezier(.2,.8,.2,1); }
.cap.on { transform: none; }
.cap.out { transform: translateX(40px); }

.note { position: absolute; left: 50%; top: clamp(64px, 10vh, 110px); transform: translateX(-50%); text-align: center; z-index: 3; width: min(560px, calc(100vw - 32px)); padding: clamp(24px, 4vw, 40px); border-radius: 28px; background: color-mix(in srgb, var(--panel) 78%, transparent); border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); box-shadow: 0 30px 80px -30px rgba(0,0,0,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; visibility: hidden; transition: opacity calc(1.1s / var(--speed)) ease, visibility 0s linear calc(1.1s / var(--speed)), translate calc(1.1s / var(--speed)) cubic-bezier(.2,.8,.2,1); translate: 0 24px; cursor: auto; }
.note.on { opacity: 1; visibility: visible; translate: 0 0; transition-delay: 0s; }
.note .to { margin: 0 0 10px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--c-1); font-weight: 600; }
.note h1 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(32px, 5vw, 56px); line-height: 1.08; color: var(--ink); }
.note p { margin: 16px 0 0; font-size: clamp(16px, 1.6vw, 18px); line-height: 1.65; color: color-mix(in srgb, var(--ink) 82%, transparent); }
.note .from { margin-top: 20px; font-family: var(--font-display); font-style: italic; font-size: 22px; color: var(--ink); }

.hint { position: absolute; left: 50%; bottom: clamp(20px, 4vh, 36px); z-index: 2; translate: -50% 0; margin: 0; padding: 8px 16px; border-radius: 999px; font-size: 13px; letter-spacing: .04em; color: var(--ink); background: color-mix(in srgb, var(--panel) 60%, transparent); opacity: .9; pointer-events: none; transition: opacity .6s; animation: nudge calc(2.4s / var(--speed)) ease-in-out infinite; }
.hint.off { opacity: 0; }
@keyframes nudge { 50% { translate: -50% -5px; } }
.dots { position: absolute; left: 16px; bottom: 26px; z-index: 3; display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); opacity: .25; transition: opacity .4s, width .4s; }
.dots i.on { opacity: .9; width: 20px; border-radius: 4px; }
.controls { position: absolute; right: 16px; bottom: 16px; z-index: 4; display: flex; gap: 8px; }
.controls button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); background: color-mix(in srgb, var(--panel) 62%, transparent); color: var(--ink); font: 500 14px var(--font-text); cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.controls button:hover { background: color-mix(in srgb, var(--panel) 88%, transparent); }
.controls button:focus-visible { outline: 2px solid var(--c-1); outline-offset: 2px; }
@media (max-width: 640px) {
  .controls { bottom: 12px; right: 12px; }
  .controls button { padding: 0 12px; font-size: 13px; }
  .dots { bottom: 30px; }
  .hint { bottom: 70px; }
  .note {  }
}
@media (prefers-reduced-motion: reduce) {
  .cap, .note, .hint { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="stage">
<canvas id="cv" aria-hidden="true"></canvas>
<div class="caps" aria-live="polite">
<p class="cap" data-fx="slide" data-owd-text="babak1" data-owd-label="Teks babak 1">Setiap malam ada kereta yang lewat sini.</p>
<p class="cap" data-fx="slide" data-owd-text="babak2" data-owd-label="Teks babak 2">Malam ini ia berhenti sebentar.</p>
<p class="cap" data-fx="slide" data-owd-text="babak3" data-owd-label="Teks babak 3">Membawa satu kata untukmu.</p>
</div>
<main class="note">
  <p class="to" data-owd-text="untuk" data-owd-label="Untuk (sapaan)">Untuk Ibu di Yogyakarta,</p>
  <h1 data-owd-text="judul" data-owd-label="Judul">Lebaran ini aku pulang.</h1>
  <p data-owd-text="pesan" data-owd-label="Pesan" data-owd-multi>Tiket sudah di tangan, kursi dekat jendela. Tolong simpankan opor yang paling banyak kuahnya.</p>
  <p class="from" data-owd-text="dari" data-owd-label="Dari (tanda tangan)">Anakmu, Gilang</p>
</main>
<p class="hint" data-owd-text="petunjuk" data-owd-label="Petunjuk ketuk">Ketuk untuk melanjutkan</p>
<div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="controls">
  <button type="button" id="pause" aria-pressed="false">Jeda</button>
  <button type="button" id="again">Ulangi</button>
</div>
</div>
<script>
/* ==== SETTINGS: length of each act (seconds), auto-advance, and scene data ==== */
const CONFIG = /*owd:data name="CONFIG" label="Pengaturan animasi &amp; kata di jendela kereta"*/{
  "detikPerBabak": 4.5,
  "majuOtomatis": true,
  "kata": "PULANG"
}/*owd:end*/;
function scene(api) {
  const { g, COL, seg, lerp, ease, rnd, rgba, glowDot } = api;
  const stars = []; for (let i = 0; i < 110; i++) stars.push([rnd(), rnd() * 0.55, rnd() * 6]);
  const sparks = []; for (let i = 0; i < 60; i++) sparks.push([rnd(), rnd(), rnd() * 6, 0.4 + rnd() * 0.6]);
  return {
    draw(t, B) {
      const W = api.W, H = api.H, u = Math.min(W, H) / 100;
      for (const s of stars) { g.fillStyle = rgba("#ffffff", 0.2 + 0.5 * Math.abs(Math.sin(t * 0.6 + s[2]))); g.fillRect(s[0] * W, s[1] * H, 1.5, 1.5); }
      glowDot(W * 0.78, H * 0.2, u * 22, COL["c-3"], 0.25); g.fillStyle = api.mix(COL["c-3"], "#ffffff", 0.6); g.beginPath(); g.arc(W * 0.78, H * 0.2, u * 6, 0, 7); g.fill();
      /* Hills and an arched bridge. */
      g.fillStyle = api.mix(COL["bg-1"], COL["bg-2"], 0.5); g.beginPath(); g.moveTo(0, H); g.lineTo(0, H * 0.72); g.quadraticCurveTo(W * 0.3, H * 0.6, W * 0.6, H * 0.74); g.quadraticCurveTo(W * 0.85, H * 0.82, W, H * 0.7); g.lineTo(W, H); g.fill();
      const ty = H * 0.66;
      g.fillStyle = COL["bg-1"]; g.fillRect(0, ty, W, u * 1.6);
      g.strokeStyle = COL["bg-1"]; g.lineWidth = u * 1.2;
      const span = Math.max(u * 22, W / 6);
      for (let x = -span / 2; x < W + span; x += span) { g.beginPath(); g.arc(x, ty + span * 0.75, span * 0.6, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); g.fillStyle = COL["bg-1"]; g.fillRect(x - u * 1.5, ty, u * 3, H - ty); }
      /* Kereta: lokomotif + gerbong. Posisi mengikuti babak. */
      const word = String(CONFIG.kata || "RINDU").toUpperCase().slice(0, 10).split("");
      const cars = Math.max(3, word.length), carW = Math.min(u * 15, (W * 0.9) / (cars + 1.3)), carH = carW * 0.55, gap = carW * 0.08;
      const len = (cars + 1.3) * (carW + gap);
      const enter = seg(B, 0.1, 1.0), leave = seg(B, 2.05, 2.95);
      const stopX = (W - len) / 2;
      const x0 = enter < 1 ? lerp(-len - W * 0.1, stopX, ease(enter)) : lerp(stopX, W + W * 0.2, leave * leave);
      const light = seg(B, 1.15, 1.95);
      const moving = enter < 1 || leave > 0;
      for (let i = 0; i < cars; i++) {
        const x = x0 + i * (carW + gap), y = ty - carH - u * 0.8 + (moving ? Math.sin(t * 18 + i) * 0.6 : 0);
        g.fillStyle = COL["c-2"]; g.beginPath(); g.roundRect ? g.roundRect(x, y, carW, carH, carH * 0.18) : g.rect(x, y, carW, carH); g.fill();
        g.fillStyle = rgba("#000000", 0.25); g.fillRect(x, y + carH * 0.78, carW, carH * 0.08);
        const wx = x + carW * 0.18, ww = carW * 0.64, wy = y + carH * 0.18, wh = carH * 0.48;
        const lit = 0.55 + 0.45 * seg(light, i / cars * 0.6, i / cars * 0.6 + 0.4);
        g.fillStyle = rgba(COL["c-3"], lit); g.fillRect(wx, wy, ww, wh);
        if (moving && lit > 0.5) glowDot(wx + ww / 2, wy + wh / 2, carW * 0.7, COL["c-3"], 0.12);
        const ch = word[i];
        if (ch && light > 0) { const k = seg(light, i / cars * 0.6, i / cars * 0.6 + 0.4) * (1 - leave * 3); if (k > 0) { glowDot(wx + ww / 2, wy + wh / 2, carW * 0.9, COL["c-3"], 0.3 * k); g.globalAlpha = Math.max(0, k); g.fillStyle = COL["bg-1"]; g.font = "700 " + Math.round(wh * 0.82) + "px " + getComputedStyle(document.documentElement).getPropertyValue("--font-display"); g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(ch, wx + ww / 2, wy + wh * 0.55); g.globalAlpha = 1; } }
        g.fillStyle = COL["bg-1"]; g.beginPath(); g.arc(x + carW * 0.22, ty - u * 0.6, carH * 0.13, 0, 7); g.arc(x + carW * 0.78, ty - u * 0.6, carH * 0.13, 0, 7); g.fill();
      }
      /* Locomotive in front. */
      const lx = x0 + cars * (carW + gap), ly = ty - carH * 1.05 - u * 0.8;
      g.fillStyle = COL["c-1"]; g.fillRect(lx, ly + carH * 0.25, carW * 1.1, carH * 0.8); g.fillRect(lx, ly - carH * 0.05, carW * 0.45, carH * 0.4);
      g.fillRect(lx + carW * 0.75, ly - carH * 0.12, carW * 0.14, carH * 0.4);
      glowDot(lx + carW * 1.12, ly + carH * 0.6, u * 8, "#fff3c4", 0.6);
      for (let i = 0; i < 5; i++) { const k = (t * 0.6 + i / 5) % 1; if (!moving) continue; glowDot(lx + carW * 0.82 - k * u * 18, ly - carH * 0.2 - k * u * 10, u * (1.5 + k * 4), "#cfd3e6", 0.25 * (1 - k)); }
      /* After the train leaves: stars rise from the rails. */
      if (leave > 0) for (const s of sparks) { const k = (s[1] + t * 0.08 * s[3]) % 1; const x = s[0] * W + Math.sin(t + s[2]) * u, y = lerp(ty, H * 0.1, k); glowDot(x, y, u * 1.6, COL["c-3"], 0.6 * (1 - k) * leave); }
    },
  };
}
const stage = document.querySelector(".stage");
const cv = document.getElementById("cv");
const g = cv.getContext("2d");
const caps = [...document.querySelectorAll(".cap")];
const note = document.querySelector(".note");
const hint = document.querySelector(".hint");
const dots = [...document.querySelectorAll(".dots i")];
const btnPause = document.getElementById("pause");
const btnAgain = document.getElementById("again");
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const N = caps.length + 1; /* last act = greeting card */
const css = getComputedStyle(document.documentElement);
const COL = {};
function readColors() { for (const k of ["bg-1", "bg-2", "bg-3", "c-1", "c-2", "c-3", "ink", "panel"]) COL[k] = css.getPropertyValue("--" + k).trim() || "#888"; COL.speed = parseFloat(css.getPropertyValue("--speed")) || 1; }
readColors();

/* Falling letters for the "letters" effect. */
for (const c of caps) if (c.dataset.fx === "letters") { const words = c.textContent.split(/(\s+)/); c.textContent = ""; let i = 0; for (const w of words) { const s = document.createElement("span"); s.className = "w"; s.style.setProperty("--i", i++); s.textContent = w; c.appendChild(s); } }

/* Scene helpers. */
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const seg = (v, a, b) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rgba(hex, a) {
  const m = /rgba?\(([^)]+)\)/.exec(hex); if (m) { const v = m[1].split(","); return "rgba(" + v[0] + "," + v[1] + "," + v[2] + "," + a + ")"; }
  let h = String(hex).replace("#", ""); if (h.length === 3) h = h.split("").map((x) => x + x).join("");
  const n = parseInt(h.slice(0, 6), 16); if (isNaN(n)) return "rgba(255,255,255," + a + ")";
  return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
}
function mix(h1, h2, t) {
  const p = (h) => { const m = /rgba?\(([^)]+)\)/.exec(h); if (m) return m[1].split(",").map(Number); let s = String(h).replace("#", ""); if (s.length === 3) s = s.split("").map((x) => x + x).join(""); const n = parseInt(s.slice(0, 6), 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const a = p(h1), b = p(h2); return "rgb(" + Math.round(lerp(a[0], b[0], t)) + "," + Math.round(lerp(a[1], b[1], t)) + "," + Math.round(lerp(a[2], b[2], t)) + ")";
}
function glowDot(x, y, r, color, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(color, a)); gr.addColorStop(1, rgba(color, 0)); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
function heart(x, y, s) { g.beginPath(); g.moveTo(x, y + s * 0.35); g.bezierCurveTo(x, y, x - s * 0.5, y - s * 0.1, x - s * 0.5, y + s * 0.25); g.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s); g.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.25); g.bezierCurveTo(x + s * 0.5, y - s * 0.1, x, y, x, y + s * 0.35); g.fill(); }
/* Points that form the text (for the particles that spell the word). */
function textPoints(text, w, h, step, font) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  let fs = h * 0.8; x.font = (font || "700 ") + fs + "px " + (css.getPropertyValue("--font-display") || "serif");
  while (x.measureText(text).width > w * 0.94 && fs > 10) { fs -= 4; x.font = (font || "700 ") + fs + "px " + (css.getPropertyValue("--font-display") || "serif"); }
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(text, w / 2, h / 2);
  const d = x.getImageData(0, 0, w, h).data, pts = [];
  for (let yy = 0; yy < h; yy += step) for (let xx = 0; xx < w; xx += step) if (d[(yy * w + xx) * 4 + 3] > 120) pts.push([xx / w - 0.5, yy / h - 0.5]);
  return pts;
}

let W = 0, H = 0, DPR = 1;
const api = { g, COL, CONFIG, rnd, clamp, lerp, ease, seg, rgba, mix, glowDot, heart, textPoints, get W() { return W; }, get H() { return H; }, get small() { return W < 640; } };
const S = scene(api);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (S.resize) S.resize(W, H);
}

/* Story time: B rises slowly toward the target; the target rises one act every detikPerBabak. */
let B = 0, target = 0, t = 0, last = 0, raf = 0, paused = false, held = 0, frameN = 0, shown = -1;
const beatSec = () => Math.max(1.5, +CONFIG.detikPerBabak || 4.5) / COL.speed;
function setBeat(i) {
  if (i === shown) return; shown = i;
  caps.forEach((c, k) => { c.classList.toggle("on", k === i); c.classList.toggle("out", k < i); c.setAttribute("aria-hidden", k === i ? "false" : "true"); });
  note.classList.toggle("on", i >= N - 1);
  dots.forEach((d, k) => d.classList.toggle("on", k === i));
  if (i > 0) hint.classList.add("off");
}
function next() { if (target < N - 1) { target = Math.min(N - 1, Math.floor(target + 1e-6) + 1); held = 0; } }
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000 || 0.016)); last = now;
  if (!paused) {
    t += dt * COL.speed;
    held += dt;
    if (CONFIG.majuOtomatis !== false && held > beatSec() && target < N - 1) next();
    B += (target - B) * Math.min(1, dt * 1.6 * COL.speed);
    if (Math.abs(target - B) < 0.002) B = target;
  }
  if (++frameN % 30 === 0) readColors();
  setBeat(Math.min(N - 1, Math.round(B - 0.2 < 0 ? 0 : B - 0.2)));
  g.clearRect(0, 0, W, H);
  S.draw(t, B, dt);
  raf = requestAnimationFrame(frame);
}
function start() { cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(frame); }
function still() { cancelAnimationFrame(raf); B = target = N - 1; t = 20; setBeat(N - 1); g.clearRect(0, 0, W, H); S.draw(t, B, 0); }

stage.addEventListener("click", (e) => { if (e.target.closest(".note, .controls")) return; next(); });
addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "ArrowRight" || e.key === "Enter") && !e.target.closest("button, a")) { e.preventDefault(); next(); } });
btnPause.addEventListener("click", () => { paused = !paused; btnPause.textContent = paused ? "Lanjutkan" : "Jeda"; btnPause.setAttribute("aria-pressed", String(paused)); stage.classList.toggle("paused", paused); });
btnAgain.addEventListener("click", () => { B = target = 0; held = 0; t = 0; shown = -1; hint.classList.remove("off"); if (S.reset) S.reset(); if (reduce.matches) { still(); return; } paused = false; btnPause.textContent = "Jeda"; start(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) cancelAnimationFrame(raf); else if (!reduce.matches && !window.OWD_THUMB) start(); });
reduce.addEventListener("change", () => (reduce.matches ? still() : start()));
addEventListener("resize", () => { resize(); if (reduce.matches || window.OWD_THUMB) still(); });

resize();
if (window.OWD_THUMB || reduce.matches) still();
else { setBeat(0); start(); }
</script>
</body>
</html>

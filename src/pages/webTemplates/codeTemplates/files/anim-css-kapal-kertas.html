<style id="owd-theme">
/* Colors & style: edit here or in the OneWebDev editor. */
:root {
  --bg-1: #1d3557; /* Latar bawah */
  --bg-2: #a8dadc; /* Latar atas */
  --c-1: #e63946; /* Bendera */
  --c-2: #457b9d; /* Ombak */
  --c-3: #ffd166; /* Matahari */
  --ink: #f8fbff; /* Warna teks */
  --speed: 1; /* Kecepatan animasi [0.25,3,0.05] */
}
</style>
<style>
:root { --k: calc(1s / var(--speed)); --font-display: "Lora", Georgia, serif; --font-text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg-1); color: var(--ink); font-family: var(--font-text); overflow: hidden; }
.stage { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(180deg, var(--bg-2), var(--bg-1)); }
.scene, .scene * { position: absolute; }
.scene { inset: 0; }
.scene i, .scene b, .scene span { display: block; }

.cap { position: absolute; left: 50%; top: clamp(56px, 9vh, 96px); transform: translateX(-50%); text-align: center; align-items: center; z-index: 5; display: flex; flex-direction: column; gap: 12px; width: min(520px, calc(100vw - 32px)); animation: capIn calc(var(--k) * 1.2) cubic-bezier(.2,.8,.2,1) both; }
.cap .kicker { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--c-1); }
.cap h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(32px, 5.4vw, 64px); line-height: 1.05; text-wrap: balance; text-shadow: 0 2px 24px color-mix(in srgb, var(--bg-1) 70%, transparent); }
.cap p.text { margin: 0; font-size: clamp(15px, 1.6vw, 18px); line-height: 1.6; color: color-mix(in srgb, var(--ink) 84%, transparent); text-shadow: 0 1px 12px color-mix(in srgb, var(--bg-1) 80%, transparent); }
.cap .cta { align-self: center; margin-top: 6px; display: inline-flex; align-items: center; min-height: 46px; padding: 0 22px; border-radius: 999px; background: var(--c-1); color: var(--bg-1); font-weight: 600; text-decoration: none; box-shadow: 0 12px 30px -12px color-mix(in srgb, var(--c-1) 80%, #000); }
.cap .cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
@keyframes capIn { from { opacity: 0; translate: 0 20px; } }

.controls { position: absolute; right: 16px; bottom: 16px; z-index: 6; display: flex; gap: 8px; }
.controls button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); background: color-mix(in srgb, var(--bg-1) 55%, transparent); color: var(--ink); font: 500 14px var(--font-text); cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.controls button:focus-visible { outline: 2px solid var(--c-1); outline-offset: 2px; }
.stage.paused *, .stage.paused *::before, .stage.paused *::after { animation-play-state: paused !important; }
@media (max-width: 640px) {
  .cap {  }
  .controls { right: 12px; bottom: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .stage *, .stage *::before, .stage *::after { animation-play-state: paused !important; }
  .cap { animation: none; }
}

/* ---- scene ---- */

.stage { animation: dusk calc(var(--k) * 16) ease-in-out infinite alternate; }
@keyframes dusk { to { background-color: var(--bg-1); filter: hue-rotate(-12deg) brightness(.75); } }
.orb { left: 70%; top: 14%; width: 18vmin; height: 18vmin; border-radius: 50%; background: var(--c-3); box-shadow: 0 0 60px 10px color-mix(in srgb, var(--c-3) 50%, transparent); animation: orb calc(var(--k) * 16) ease-in-out infinite alternate; }
@keyframes orb { 0% { translate: 0 0; } 45% { translate: 0 40vh; } 55% { translate: 0 40vh; background: #f4f1e6; } 100% { translate: -40vw 0; background: #f4f1e6; box-shadow: inset -4vmin -2vmin 0 color-mix(in srgb, var(--bg-1) 70%, #000); } }
.star-field i { width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: 0; animation: starsOn calc(var(--k) * 16) ease-in-out infinite alternate, twinkle calc(var(--k) * 2) ease-in-out infinite alternate; animation-delay: 0s, calc(var(--k) * var(--d)); }
@keyframes starsOn { 0%, 55% { opacity: 0; } 100% { opacity: .9; } }
@keyframes twinkle { to { scale: .4; } }
.wave { left: -50%; width: 200%; border-radius: 0; background: radial-gradient(60px 26px at 60px 0, transparent 98%, var(--c)) 0 0 / 120px 100% repeat-x; -webkit-mask: none; animation: roll calc(var(--k) * var(--t)) linear infinite; }
.w1 { --c: var(--c-2); --t: 5; bottom: 0; height: 18%; }
.w2 { --c: color-mix(in srgb, var(--c-2) 80%, #fff); --t: 7; bottom: 8%; height: 18%; animation-direction: reverse; opacity: .85; }
.w3 { --c: color-mix(in srgb, var(--c-2) 55%, #fff); --t: 10; bottom: 16%; height: 16%; opacity: .7; }
@keyframes roll { to { translate: 120px 0; } }
.boat { left: 50%; bottom: 20%; width: 34vmin; height: 26vmin; margin-left: -17vmin; transform-origin: 50% 100%; animation: rock calc(var(--k) * 3.2) ease-in-out infinite alternate, sail calc(var(--k) * 16) ease-in-out infinite alternate; }
@keyframes rock { from { rotate: -7deg; translate: 0 6px; } to { rotate: 7deg; translate: 0 -8px; } }
@keyframes sail { from { left: 30%; } to { left: 66%; } }
.hull { left: 0; right: 0; bottom: 0; height: 32%; background: #fbfaf5; clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%); box-shadow: inset 0 -6px 0 rgba(0,0,0,.08); }
.sail { left: 30%; bottom: 32%; width: 40%; height: 68%; background: linear-gradient(90deg, #fff, #e8e6dc); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.flag { left: 49%; top: -6%; width: 14%; height: 12%; background: var(--c-1); clip-path: polygon(0 0, 100% 50%, 0 100%); animation: wave calc(var(--k) * .6) ease-in-out infinite alternate; transform-origin: 0 50%; }
@keyframes wave { to { scale: .7 1; } }
</style>
</head>
<body>

<div class="orb"></div><div class="star-field"><i style="left:0.0%;top:0.0%;--d:0"></i><i style="left:37.0%;top:8.0%;--d:-0.6"></i><i style="left:74.0%;top:16.0%;--d:-1.2"></i><i style="left:11.0%;top:24.0%;--d:-1.7999999999999998"></i><i style="left:48.0%;top:32.0%;--d:-2.4"></i><i style="left:85.0%;top:40.0%;--d:-3"></i><i style="left:22.0%;top:3.0%;--d:-3.5999999999999996"></i><i style="left:59.0%;top:11.0%;--d:0"></i><i style="left:96.0%;top:19.0%;--d:-0.6"></i><i style="left:33.0%;top:27.0%;--d:-1.2"></i><i style="left:70.0%;top:35.0%;--d:-1.7999999999999998"></i><i style="left:7.0%;top:43.0%;--d:-2.4"></i><i style="left:44.0%;top:6.0%;--d:-3"></i><i style="left:81.0%;top:14.0%;--d:-3.5999999999999996"></i><i style="left:18.0%;top:22.0%;--d:0"></i><i style="left:55.0%;top:30.0%;--d:-0.6"></i><i style="left:92.0%;top:38.0%;--d:-1.2"></i><i style="left:29.0%;top:1.0%;--d:-1.7999999999999998"></i><i style="left:66.0%;top:9.0%;--d:-2.4"></i><i style="left:3.0%;top:17.0%;--d:-3"></i><i style="left:40.0%;top:25.0%;--d:-3.5999999999999996"></i><i style="left:77.0%;top:33.0%;--d:0"></i><i style="left:14.0%;top:41.0%;--d:-0.6"></i><i style="left:51.0%;top:4.0%;--d:-1.2"></i><i style="left:88.0%;top:12.0%;--d:-1.7999999999999998"></i><i style="left:25.0%;top:20.0%;--d:-2.4"></i><i style="left:62.0%;top:28.0%;--d:-3"></i><i style="left:99.0%;top:36.0%;--d:-3.5999999999999996"></i><i style="left:36.0%;top:44.0%;--d:0"></i><i style="left:73.0%;top:7.0%;--d:-0.6"></i></div>
<div class="wave w3"></div><div class="boat"><i class="hull"></i><i class="sail"></i><i class="flag"></i></div><div class="wave w2"></div><div class="wave w1"></div>
</div>
<main class="cap">
  <p class="kicker" data-owd-text="label" data-owd-label="Label kecil">Bon voyage</p>
  <h1 data-owd-text="judul" data-owd-label="Judul">Selamat berlayar ke babak baru.</h1>
  <p class="text" data-owd-text="pesan" data-owd-label="Pesan" data-owd-multi>Untuk teman yang pindah kota, pensiun, atau memulai perjalanan baru. Ombaknya akan selalu mengantar pulang.</p>
  <a class="cta" href="https://wa.me/?text=Selamat%20berlayar!" data-owd-href="tautan" data-owd-href-label="Tautan tombol" data-owd-text="tombol" data-owd-label="Teks tombol">Kirim ucapan</a>
</main>
<div class="controls">
  <button type="button" id="pause" aria-pressed="false">Jeda</button>
  <button type="button" id="again">Ulangi</button>
</div>
</div>
<script>
/* ==== SETTINGS: autoplay, and the second shown as a still frame ==== */
const CONFIG = /*owd:data name="CONFIG" label="Pengaturan animasi"*/{
  "mainOtomatis": true,
  "detikDiam": 5
}/*owd:end*/;
const stage = document.querySelector(".stage");
const btnPause = document.getElementById("pause");
const btnAgain = document.getElementById("again");
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const anims = () => (document.getAnimations ? document.getAnimations() : []);
/* Freeze every CSS animation on one chosen frame (thumbnails, reduce motion). */
function still() { const ms = (+CONFIG.detikDiam || 0) * 1000; for (const a of anims()) { try { a.currentTime = ms; a.pause(); } catch (e) {} } }
function setPaused(p) { stage.classList.toggle("paused", p); btnPause.textContent = p ? "Lanjutkan" : "Jeda"; btnPause.setAttribute("aria-pressed", String(p)); }
btnPause.addEventListener("click", () => setPaused(!stage.classList.contains("paused")));
btnAgain.addEventListener("click", () => { if (reduce.matches) return still(); for (const a of anims()) { try { a.currentTime = 0; a.play(); } catch (e) {} } setPaused(false); });
/* Hidden tab: pause; visible again: resume unless the visitor paused it. */
let pausedByUser = false;
document.addEventListener("visibilitychange", () => { if (document.hidden) { pausedByUser = stage.classList.contains("paused"); stage.classList.add("paused"); } else if (!pausedByUser && !reduce.matches && !window.OWD_THUMB) stage.classList.remove("paused"); });
reduce.addEventListener("change", () => (reduce.matches ? still() : btnAgain.click()));
if (window.OWD_THUMB || reduce.matches) still();
else if (CONFIG.mainOtomatis === false) setPaused(true);
</script>

# v13: deploys DEMO MODE (frontend without a backend) to GitHub Pages.
# Enable once: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Run it manually from the Actions tab ("Run workflow"). To deploy on every push to main/master,
# create the repo variable DEMO_PAGES_AUTO = true (Settings → Secrets and variables → Actions → Variables).
name: deploy-demo-pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.DEMO_PAGES_AUTO == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - name: Build demo
        run: npm run build:demo
        env:
          # Path prefix from GitHub: "/repo/" for project sites, "/" for name.github.io or
          # a custom domain. Can be overridden with the repo variable DEMO_BASE_PATH (Settings → Variables).
          VITE_BASE_PATH: ${{ vars.DEMO_BASE_PATH || steps.pages.outputs.base_path || '/' }}
      - name: SPA fallback and no Jekyll
        # GitHub Pages has no rewrites: 404.html = index.html so that /id/page-maker etc.
        # still open the app when visited directly or refreshed.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

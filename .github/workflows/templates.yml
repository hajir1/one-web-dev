# Automatic checks for every web template (no. 12): overflow at 375/768/1280, JS errors,
# axe-core WCAG 2 A/AA, and Lighthouse (mobile) on 10 sample templates.
# Fails only on NEW problems compared with scripts/templates-ci/baseline.json.
# Templates improved? Run `npm run templates:gen && npm run templates:baseline` and commit the baseline.
name: templates-check

on:
  pull_request:
    paths:
      - "src/pages/webTemplates/**"
      - "src/pages/pageMaker/**"
      - "scripts/templates-ci/**"
  schedule:
    - cron: "0 20 * * 0" # Monday 03:00 WIB (UTC+7)
  workflow_dispatch:

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The checking tools stay out of package-lock so regular CI stays light.
      - run: npm i --no-save playwright@1.63.0 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - run: npm run templates:gen
      - run: node scripts/templates-ci/check.mjs .template-sites --jobs=4 --lighthouse=10
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-report
          path: .template-sites/report.json

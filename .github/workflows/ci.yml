# OneWebDev frontend CI (v10): typecheck, lint, unit tests, and the PWA build.
name: frontend-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # The CI build does not need a real backend.
          VITE_API_BASE_URL: https://api.example.com
